name: caos
version: 0.1.0
description: >
  Wires Hermes to caos: bans the built-in toolsets caos replaces
  (terminal, file, code_execution) and installs the caos MCP server plus
  the hook plugin that attributes tool calls to a caos conversation.
hermes_requires: ">=0.0.0"
author: "Metta-AI/caos"
license: MIT
# Default distribution_owned (config.yaml, mcp.json, skills, cron,
# distribution.yaml) doesn't include arbitrary directories -- confirmed by a
# real install dropping bin/ silently. Declare it explicitly.
distribution_owned:
  - config.yaml
  - distribution.yaml
  - plugins
  - README.md
env_requires:
  - name: CAOS_HERMES_DIST_DIR
    description: >
      Path to this distribution's own root (the directory containing
      scripts/caos-mcp-launch) -- distinct from CAOS_REPO below: a bundled
      deployment (`nix run .#hermes-gateway`) installs from a
      nix build product (integrations/hermes copied into the store), not a
      live caos checkout, so the two are different paths there. For a
      hand-run Desktop profile they're usually the same checkout's
      integrations/hermes subdirectory.
    required: true
  - name: CAOS_MCP_DEFAULT_SERVER
    description: >
      Default caos server URL for a NEW session with no
      `/caos-session-server <url>` on its first prompt's leading line (e.g.
      `http://localhost:9090` for a local dev stack, or a `caos://<ticket>`
      remote). Read once per session, not once per profile -- different
      sessions under this same profile can still override it per-prompt;
      this is only what a session gets when it doesn't ask for anything else.
      Always set, on every deploy -- NOT specific to dev/testing despite
      caos-mcp-launch also querying its refs/caos/dev as an automatic,
      always-attempted probe for --llm-step's own revision (when that probe
      finds nothing, --llm-step falls back to Metta-AI/caos-session's own
      main tip, hardcoded, not configured through this or any other var).
    required: true
  - name: CAOS_BIN
    description: >
      Optional path to a pre-built caos binary. When set, skips CAOS_REPO
      and the nix build entirely -- useful for a dev build
      (rust/target/debug/caos-cli) without waiting on a release build, and
      the only binary-resolution path a `hermes-gateway` deploy
      uses at all.
    required: false
  - name: CAOS_REPO
    description: >
      Path to a local caos checkout, used ONLY as a fallback to
      `nix build $CAOS_REPO#caos-cli` when CAOS_BIN isn't set -- i.e. only
      for building the caos BINARY. Unrelated to --llm-step resolution,
      which no longer reads this (or any other) var at all: it's either the
      server's own refs/caos/dev probe, or the hardcoded
      Metta-AI/caos-session fallback.
    required: false
