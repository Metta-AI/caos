# Publish the caos Claude Code client.
#
# The release carries five assets, which together are everything a machine that
# has never seen caos needs:
#
#   caos-x86_64-linux             the client, statically linked
#   git-remote-caos-x86_64-linux  the git remote helper for a caos:// server
#   claude-settings.json          the hooks and the deny list
#   mcp.json                      the tool server declaration
#   install.sh                    fetches the client and puts it in place
#
# WHY A RELEASE AND NOT A BUILD IN THE CONSUMER. A Claude Code cloud VM has a
# five-minute setup budget and a filesystem snapshot; compiling there spends the
# budget and, worse, anything built after the snapshot is never cached. A curl
# of a static binary costs seconds and lands in the snapshot. It is also the
# only way to reach a repository that is not this one -- there is no source
# there to build.
#
# GitHub is already on the cloud environment's Trusted allowlist, so consuming
# this needs no network-policy change at all.
name: release

# Builds AND releases on every push: the release is how an unauthenticated
# machine gets the binary at all, so gating it on a tag meant no cloud session
# could be tested without minting a version first. A tag names itself; a branch
# build is named `build-<commit>`, by the commit alone.
#
# `caos/**` is excluded deliberately: the tui publishes each conversation to
# `caos/<conversation-id>` (rust/crates/caos-cli/TUI.md), so building those
# would fire a job per published conversation.
on:
  push:
    branches-ignore: ["caos/**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `nix build .#caos-cli` is the same build a developer runs; nothing about
      # the artifact is release-specific.
      #
      # No general nix cache. magic-nix-cache now requires a FlakeHub account
      # and failed with "Unable to authenticate to FlakeHub", caching nothing;
      # cache.nixos.org already serves everything the client build needs, since
      # those derivations are stock nixpkgs.

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build the client
        run: nix build .#caos-cli

      # `result/bin/caos-cli` is a WRAPPER script that sets CAOS_REV and execs
      # the real binary elsewhere in the store. The wrapper is not distributable
      # -- it names /nix/store paths that do not exist anywhere else -- so what
      # ships is the inner executable, which is static and depends on nothing.
      - name: Stage the assets
        id: stage
        run: |
          set -euo pipefail
          # A tag names itself. A branch build is named by its COMMIT and
          # nothing else -- `build-<12 hex>`.
          #
          # The branch name is deliberately absent. It was in this name once,
          # as `<branch>-<sha>`, and `-` is legal in a branch name, so `cc` and
          # `cc-conversations` produced tags no parse could tell apart. A
          # consumer that wants a branch asks GitHub which commits are on it
          # and looks each one up here; that is an exact question with an exact
          # answer, where parsing a name back apart never was.
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"
          else
            tag="build-$(git rev-parse HEAD | cut -c1-12)"
          fi
          wrapper="$(readlink -f result/bin/caos-cli)"
          inner="$(grep -o '/nix/store/[^"]*caos-cli-bin/bin/caos-cli' "$wrapper" | tail -1)"
          test -n "$inner" || { echo "could not find the inner binary in $wrapper" >&2; exit 1; }
          # `file` says "static-pie linked" for this binary and `ldd` says
          # "statically linked" -- accept either, and fail loudly rather than
          # publish something that needs an interpreter the target lacks.
          file "$inner" | grep -qE 'static-pie linked|statically linked' \
            || { echo "$inner is not static:"; file "$inner"; exit 1; } >&2

          mkdir -p dist
          install -m 0755 "$inner" dist/caos-x86_64-linux
          # THE GIT REMOTE HELPER, from the same store directory as the client
          # it serves. `git` execs it by name for a `caos://` remote and caos
          # shells out to git for every push and fetch, so shipping one without
          # the other yields a session that resolves a server it cannot push to.
          install -m 0755 "${inner%/*}/git-remote-caos" dist/git-remote-caos-x86_64-linux
          file dist/git-remote-caos-x86_64-linux | grep -qE 'static-pie linked|statically linked' \
            || { echo "the helper is not static:"; file dist/git-remote-caos-x86_64-linux; exit 1; } >&2
          # It must read the OS TRUST STORE, not the copy of Mozilla's roots iroh
          # compiles in: a cloud container's egress is a TLS-intercepting proxy,
          # and a build without this reaches no relay there while curl and git on
          # the same host are fine (`caos_iroh::endpoint_builder`). An unpatched
          # binary is indistinguishable from a correct one until it meets such a
          # proxy, so check the markers rustls-platform-verifier leaves behind.
          for marker in SSL_CERT_FILE SSL_CERT_DIR; do
            grep -aq "$marker" dist/git-remote-caos-x86_64-linux \
              || { echo "the helper does not read the OS trust store ($marker absent)"; exit 1; } >&2
          done
          cp integrations/claude-code/shared/settings.json dist/claude-settings.json
          cp integrations/claude-code/shared/mcp.json      dist/mcp.json
          # Copied, not stamped. install.sh resolves the build from its --base
          # and reports that; a tag baked in here could only ever disagree.
          install -m 0755 integrations/claude-code/cloud/install.sh dist/install.sh

          # Prove the thing we are about to publish actually runs, rather than
          # discovering it from a cloud VM that cannot say why.
          #
          # ASSERT THE OUTPUT, NOT THE EXIT CODE. `caos` with no arguments
          # prints its usage and exits NON-ZERO -- that is its contract -- so
          # under `set -euo pipefail` running it as a bare command fails the
          # step for a binary that is working perfectly.
          banner="$(./dist/caos-x86_64-linux 2>&1 || true)"
          case "$banner" in
            *"usage:"*) printf '%s\n' "$banner" | head -1 ;;
            *) echo "no usage banner from the built client:"; printf '%s\n' "$banner"; exit 1 ;;
          esac
          mcp="$(./dist/caos-x86_64-linux mcp 2>&1 || true)"
          case "$mcp" in
            *"mcp hook"*|*"mcp serve"*) echo "mcp subcommands present" ;;
            *) echo "the built client has no \`mcp\` surface:"; printf '%s\n' "$mcp"; exit 1 ;;
          esac
          helper="$(./dist/git-remote-caos-x86_64-linux 2>&1 || true)"
          case "$helper" in
            *"git-remote-caos"*) echo "the git remote helper runs" ;;
            *) echo "the built helper does not run:"; printf '%s\n' "$helper" | head -3; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Every build, so a branch push can be inspected without cutting a
      # release for it.
      - uses: actions/upload-artifact@v4
        with:
          name: caos-client-${{ steps.stage.outputs.tag }}
          path: dist/

      # EVERY build is a release, because a release is the only place GitHub
      # will serve a file to an unauthenticated machine. Actions artifacts
      # (above) need a token to download and they expire, so a cloud VM cannot
      # use them; the binary is not in git; and building in the VM was the
      # thing this exists to avoid. "Release" here is a file host, not a
      # promise about a name -- the name is the commit.
      #
      # No tag has to exist first: the action creates `tag_name` at this
      # commit, and `stage` has already computed it as `build-<commit>`.
      #
      # Branch builds are prereleases, so `latest` keeps meaning the newest
      # real version rather than whichever branch pushed most recently. Nothing
      # resolves through `latest` any more -- install.sh asks for a build by
      # commit -- so this costs nothing and stops one branch's push from
      # silently becoming everyone's default.
      # `target_commitish` IS NOT OPTIONAL, whatever the name suggests. The
      # Releases API creates a missing tag at the DEFAULT BRANCH's head unless
      # told otherwise, so without it `build-<commit>` named one commit and
      # pointed at another -- every tag published before this landed on
      # whatever main's head happened to be (build-897eebb571ff points at a
      # main merge from four days earlier, and three other tags share one
      # commit). Nothing read the target, so nothing broke; the moment anything
      # resolves a build tag to a commit, it gets the wrong tree. install.sh
      # checks the name against the target for exactly that reason.
      # THE TAG IS THE COMMIT POINT. GitHub creates `tag_name` when a release
      # is PUBLISHED, not while it is a draft — a draft lives at
      # `releases/tag/untagged-…` and `ls-remote` shows nothing for it. So this
      # uploads into a draft and publishes only once every asset is there,
      # which makes a `build-<commit>` tag MEAN a release that can install a
      # client.
      #
      # IT DID NOT MEAN THAT BEFORE. The releases API 500s intermittently — the
      # body is GitHub's "Unicorn!" page — and the old single step created the
      # tag and uploaded in one action, so a 500 part-way left the tag pointing
      # at a partial release. Measured over 60 runs: 7 failures across four
      # branches, `build-5cd8461c1be0` carrying only mcp.json and
      # `build-8e6d41fe3c8a` missing both binaries, each 404ing on
      # `caos-x86_64-linux`.
      #
      # That is worse than a red job, because install.sh walks back to the
      # newest build tag AT OR BEFORE a commit precisely so that a slightly
      # older client beats no client — and it selects on the tag existing. A
      # half-published tag is chosen and then 404s, defeating the fallback
      # exactly when it is needed.
      #
      # `gh` rather than softprops/action-gh-release: the retry below is the
      # point, and a `uses:` step cannot be retried in place.
      #
      # GH_TOKEN is the job's own GITHUB_TOKEN, which is also what stops the
      # publish from looping: a tag pushed by GITHUB_TOKEN does not start
      # another workflow run, and this workflow triggers on `tags: ["*"]`.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.stage.outputs.tag }}
          PRERELEASE: ${{ github.ref_type != 'tag' }}
        run: |
          set -euo pipefail

          assets=(
            dist/caos-x86_64-linux
            dist/git-remote-caos-x86_64-linux
            dist/claude-settings.json
            dist/mcp.json
            dist/install.sh
          )

          # DELETE THE DRAFT UNLESS WE PUBLISHED IT. A draft carries no tag, so
          # an abandoned one is invisible to install.sh — but leaving it would
          # make the next run's create fail on a name that is already taken.
          # `--cleanup-tag` covers the re-run case below, where the release we
          # are replacing was published and does own a tag.
          published=no
          cleanup() {
            if [ "$published" = no ]; then
              echo "publish did not complete — removing the draft so no tag claims a partial release" >&2
              gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # Names the assets a complete release must carry, so "is this one
          # already good?" and "did the upload land?" ask the same question.
          missing() { # <release-tag> ; prints the basenames it does not have
            local have
            have="$(gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            local a
            for a in "${assets[@]}"; do
              if ! printf '%s\n' "$have" | grep -qxF "$(basename "$a")"; then
                printf '%s ' "$(basename "$a")"
              fi
            done
          }

          # A re-run, or a tag pushed twice, finds the release already there.
          # LEAVE A COMPLETE ONE ALONE. Deleting first and rebuilding would mean
          # a re-run against a persistent outage ends with no release where a
          # working one stood — turning a green retry into a regression. An
          # INCOMPLETE one is replaced, which is the case worth re-running for.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gap="$(missing "$TAG")"
            if [ -z "$gap" ]; then
              echo "$TAG already carries every asset — nothing to do" >&2
              published=yes
              exit 0
            fi
            echo "a release for $TAG exists but is missing: $gap — replacing it" >&2
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          flags=(--draft --target "$GITHUB_SHA" --title "$TAG" --notes "")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"

          # RETRY, because the failure this is here for is a 500 on GitHub's
          # side and the next attempt usually works — every one of the seven
          # observed failures passed on a manual re-run. `--clobber` so a
          # partially-uploaded attempt is replaced rather than colliding.
          uploaded=no
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "${assets[@]}" --clobber; then
              uploaded=yes
              break
            fi
            echo "upload attempt $attempt failed; retrying" >&2
            sleep $((attempt * 5))
          done
          if [ "$uploaded" = no ]; then
            echo "every upload attempt failed" >&2
            exit 1
          fi

          # VERIFY BEFORE PUBLISHING, rather than trusting the exit status. The
          # upload reports per-asset and has been seen to fail the step with
          # every asset present (run 35272990761) and to succeed-looking with
          # binaries missing; the release's own asset list is the fact.
          gap="$(missing "$TAG")"
          if [ -n "$gap" ]; then
            echo "assets missing after upload: $gap" >&2
            exit 1
          fi

          # The tag comes into existence here, with every asset already in place.
          gh release edit "$TAG" --draft=false
          published=yes
          echo "published $TAG with ${#assets[@]} assets" >&2
