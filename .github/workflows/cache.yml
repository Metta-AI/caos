# Fill the caos nix binary cache, so a host deploy is substitution.
#
# The hosts in prod/ (caosd-prod, watchdog-prod) never build caos: the
# watchdog is a t3.small that cannot compile the Rust workspace, and the
# server should not spend its deploy rebuilding 498 crates either. Instead
# every push builds here and pushes the signed closures to the private S3
# cache both hosts list as a substituter (prod/base.nix, and devops/tf/caos
# in metta for the bucket and roles). A deploy then only fetches.
#
# What is pushed:
#   caos-tools          the client binaries both hosts run (the heavy part)
#   deploy-caosd-prod   the server's deploy driver
#   watchdog-prod       the watchdog's whole system closure, so even its
#                       first boot from a bare AMI is a download
# caosd-prod's own system closure is not built here: it takes a per-machine
# advertise address the driver reads off the host (prod/README.md), so its
# toplevel is impure. caos-tools is nearly all of it.
#
# Authentication is GitHub OIDC assuming a role in the caos account (metta:
# devops/tf/caos/ci.tf); no AWS credential is stored in this repository.
# The signing key is read from Secrets Manager for the one `nix copy`.
#
# Same triggers as release.yml, for the same reason: a branch gets deployed
# to a host sometimes (the first watchdog deploy was one), and the cache is
# content-addressed, so a branch's paths cannot displace main's.
name: cache

on:
  push:
    branches-ignore: ["caos/**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      CACHE: s3://caos-nix-cache-109251245574?region=us-east-1
    steps:
      - uses: actions/checkout@v4

      # The same installer and store cache as release.yml, and the same key:
      # the Rust dependency build is what takes the time, and this job and
      # that one share it.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109251245574:role/caos-github-nix-cache
          aws-region: us-east-1

      # Read the cache first, so what main already pushed is not rebuilt
      # for a branch; the role may read as well as write.
      - name: Build
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths \
            --option extra-substituters "$CACHE" \
            --option extra-trusted-public-keys caos-cache-1:3BSj35RzBLAtUyTlJlLO3xa9b7uYFtIJIx17Jri8lPs= \
            .#caos-tools .#deploy-caosd-prod \
            .#nixosConfigurations.watchdog-prod.config.system.build.toplevel \
            | tee paths

      # The key touches disk for the length of one command and is removed
      # whether or not the push succeeds. Nothing prints it.
      - name: Push
        run: |
          set -euo pipefail
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          aws secretsmanager get-secret-value --secret-id caos/nix-cache-signing-key \
            --query SecretString --output text > "$key"
          # shellcheck disable=SC2046
          nix copy --to "$CACHE&secret-key=$key" $(cat paths)
          echo "pushed:"; cat paths
