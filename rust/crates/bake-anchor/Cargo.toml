# bake-anchor — this crate exists ONLY to keep the std tools' crates.io
# dependencies in the workspace, so the std/cargo bake (std/cargo/bake.nix,
# built `--workspace`) vendors and precompiles them. Source-built std tools
# (rgrep, llm-call, llm-step, …) live OUTSIDE the workspace and are compiled by
# rustc against that bake; without an anchor, deleting their old workspace crates
# would drop their deps (regex, minreq+rustls, serde_json, tiny_http) from the
# bake and every source tool would recompile them from scratch — or fail, since
# the bake builds `--offline` against a vendored registry (not because a worker
# lacks a network; see AGENTS.md "Workers"). tests/std-lint enforces
# `anchor ⊇ every std tool's crates.io deps`.
#
# Keep the versions/features in lockstep with what the std tools declare: cargo
# fingerprints on features, so a mismatch (e.g. a tool needing a non-default
# feature the anchor omits) recompiles that crate instead of reusing the bake.
[package]
name = "bake-anchor"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# conversation-protocol (loose Git object compression)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# std/rgrep, std/llm-step
regex = "1"
# std/llm-call, std/llm-step
serde_json = "1"
# conversation-protocol (v3 records)
serde = { version = "1", features = ["derive"] }
# conversation-protocol (v3 protocol ids)
sha2 = "0.10"
# conversation-protocol (in-memory validation overlay)
sha1 = "0.10"
# std/llm-step (https-rustls: the Messages API transport in llm-client)
minreq = { version = "2", default-features = false, features = ["https-rustls"] }
# std/llm-stub (the test-fixture HTTP server; the same dep the caos server uses)
tiny_http = "0.12"
