[package]
name = "conversation-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[features]
# On by default so the dependency artifact cargo builds for caos-cli (which asks
# for git-cli) is the one the crate's own jobs build: a mismatch compiled the crate
# twice in every cargo-workspace test.
default = ["git-cli"]
git-cli = []
memory-store = []
