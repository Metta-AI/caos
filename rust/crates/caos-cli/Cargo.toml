[package]
name = "caos-cli"
version = "0.1.0"
edition = "2021"

# The complete user-facing host CLI. The library owns the durable conversation
# API; conversation-protocol owns the rules shared with workers, while the
# binary combines this crate and the TUI with generic host commands from `caos`.
[lib]
name = "caos_cli"
path = "src/lib.rs"

[[bin]]
name = "caos-cli"
path = "src/bin/caos-cli.rs"

[dependencies]
caos = { path = "../caos" }
conversation-protocol = { path = "../conversation-protocol", features = ["git-cli"] }
serde_json = "1"
ratatui-core = { version = "0.1.2", features = ["std"] }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-widgets = { version = "0.3.2", default-features = false, features = ["std", "unstable-rendered-line-info"] }
# Display-width measurement for laying out markdown tables in the transcript
# (same crate ratatui measures cells with, so our column math matches the render).
unicode-width = "0.2"

# The TUI redirects fd 2 while it owns the terminal (dup/dup2), so a background
# thread's stderr line cannot scroll the alternate screen out from under the
# renderer's diff.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
